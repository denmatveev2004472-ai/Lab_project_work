<!DOCTYPE html>
<html lang="ru">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('Styles'); ?>
</head>
<body>
  <main class="app-shell">
    <header class="toolbar">
      <div>
        <p class="eyebrow">GOOGLE APPS SCRIPT</p>
        <h1>Календарь лаборатории</h1>
      </div>
      <div class="toolbar-actions">
        <button id="todayButton" class="button button-secondary">Сегодня</button>
        <button id="newEventButton" class="button button-primary">+ Событие</button>
      </div>
    </header>

    <section class="calendar-card" aria-label="Календарь">
      <div class="calendar-navigation">
        <button id="previousButton" class="icon-button" aria-label="Предыдущий месяц">‹</button>
        <h2 id="monthLabel"></h2>
        <button id="nextButton" class="icon-button" aria-label="Следующий месяц">›</button>
      </div>
      <div class="weekdays" aria-hidden="true">
        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
      </div>
      <div id="calendarGrid" class="calendar-grid" aria-live="polite"></div>
    </section>
  </main>

  <dialog id="eventDialog" class="event-dialog">
    <form id="eventForm">
      <header class="dialog-header">
        <h2 id="dialogTitle">Новое событие</h2>
        <button type="button" id="closeDialogButton" class="icon-button" aria-label="Закрыть">×</button>
      </header>
      <input id="eventId" type="hidden">
      <label>
        Название
        <input id="eventTitle" required maxlength="160" placeholder="Например, калибровка прибора">
      </label>
      <label>
        Начало
        <input id="eventStart" type="datetime-local" required>
      </label>
      <label>
        Окончание
        <input id="eventEnd" type="datetime-local" required>
      </label>
      <label class="checkbox-label">
        <input id="eventAllDay" type="checkbox">
        Весь день
      </label>
      <label>
        Место
        <input id="eventLocation" maxlength="200" placeholder="Лаборатория, кабинет или ссылка">
      </label>
      <label>
        Описание
        <textarea id="eventDescription" rows="4" placeholder="Детали события"></textarea>
      </label>
      <p id="formError" class="form-error" role="alert"></p>
      <footer class="dialog-actions">
        <button type="button" id="deleteEventButton" class="button button-danger" hidden>Удалить</button>
        <span class="dialog-spacer"></span>
        <button type="button" id="cancelButton" class="button button-secondary">Отмена</button>
        <button type="submit" class="button button-primary">Сохранить</button>
      </footer>
    </form>
  </dialog>

  <div id="loading" class="loading" hidden>Загрузка…</div>
  <?!= include('Script'); ?>
</body>
</html>
