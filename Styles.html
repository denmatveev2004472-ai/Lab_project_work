<style>
:root{--ink:#182230;--muted:#667085;--line:#e4e7ec;--surface:#fff;--canvas:#f6f8fb;--primary:#2d6cdf;--primary-dark:#1f55b8;--danger:#c73535;--weekend:#fff8f5;--today:#eaf2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--canvas);color:var(--ink);font-family:Inter,Arial,sans-serif}button,input,textarea{font:inherit}.app-shell{max-width:1240px;margin:0 auto;padding:32px 20px 48px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{margin:0 0 6px;color:var(--primary);font-size:12px;font-weight:700;letter-spacing:.11em}h1{margin:0;font-size:clamp(24px,4vw,34px)}h2{margin:0;font-size:20px}.toolbar-actions,.calendar-navigation,.dialog-actions{display:flex;align-items:center;gap:10px}.button,.icon-button{border:1px solid transparent;border-radius:9px;cursor:pointer;font-weight:650}.button{padding:10px 14px}.icon-button{display:grid;width:36px;height:36px;place-items:center;border-color:var(--line);background:#fff;color:var(--ink);font-size:25px;line-height:1}.button-primary{background:var(--primary);color:#fff}.button-secondary{border-color:var(--line);background:#fff;color:var(--ink)}.button-danger{background:#fff1f1;color:var(--danger)}.calendar-card{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 8px 24px rgba(16,24,40,.05)}.calendar-navigation{justify-content:center;padding:18px;border-bottom:1px solid var(--line)}.calendar-navigation h2{min-width:220px;text-align:center;text-transform:capitalize}.weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays{border-bottom:1px solid var(--line);background:#fbfcfe;color:var(--muted);font-size:12px;font-weight:700;text-align:center}.weekdays span{padding:12px 6px}.day{min-height:132px;padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;cursor:pointer}.day:nth-child(7n){border-right:0}.day.weekend{background:var(--weekend)}.day.outside{background:#fbfcfe;color:#98a2b3}.day.today{background:var(--today)}.day-number{display:inline-grid;width:28px;height:28px;place-items:center;border-radius:50%;font-size:13px;font-weight:700}.today .day-number{background:var(--primary);color:#fff}.events{display:grid;gap:4px;margin-top:8px}.event{overflow:hidden;padding:4px 6px;border:0;border-left:3px solid var(--primary);border-radius:4px;background:#eef4ff;color:#173f87;cursor:pointer;font-size:12px;text-align:left;text-overflow:ellipsis;white-space:nowrap}.event-time{font-weight:700}.event-more{color:var(--muted);font-size:12px}.event-dialog{width:min(560px,calc(100% - 28px));border:0;border-radius:14px;padding:0;box-shadow:0 20px 55px rgba(16,24,40,.28)}.event-dialog::backdrop{background:rgba(16,24,40,.45)}.event-dialog form{display:grid;gap:14px;padding:22px}.dialog-header{display:flex;align-items:center;justify-content:space-between}label{display:grid;gap:6px;color:#344054;font-size:13px;font-weight:650}input:not([type=checkbox]),textarea{width:100%;border:1px solid #d0d5dd;border-radius:8px;padding:10px;color:var(--ink);background:#fff}textarea{resize:vertical}.checkbox-label{display:flex;align-items:center;gap:8px}.form-error{min-height:18px;margin:0;color:var(--danger);font-size:13px}.dialog-spacer{flex:1}.loading{position:fixed;right:20px;bottom:20px;padding:10px 14px;border-radius:8px;background:#182230;color:#fff;box-shadow:0 6px 18px rgba(16,24,40,.2)}@media(max-width:700px){.toolbar{align-items:flex-start;flex-direction:column}.toolbar-actions{width:100%}.toolbar-actions .button{flex:1}.day{min-height:98px;padding:6px}.event{padding:3px 4px;font-size:11px}.calendar-navigation h2{min-width:180px;font-size:17px}}
</style>
